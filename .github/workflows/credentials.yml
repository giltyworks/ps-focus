name: Credential check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  credentials:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_credentials.py
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm "PS Focus.spec"
        env:
          PSFOCUS_OAUTH_CREDENTIALS: ${{ secrets.PSFOCUS_OAUTH_CREDENTIALS }}
      - run: python tools/check_credentials.py --archive "dist/PS Focus.exe"
      - run: python tools/write_checksums.py "dist/PS Focus.exe"
