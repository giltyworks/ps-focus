name: Build installer
# Builds the release installer on a clean Windows machine. It runs when started by hand from the Actions tab or when a
# version tag (v1.2.3) is pushed. The installer and its checksums are kept as a download on the run; publishing a
# release stays a separate, manual step.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      # The same versions as the local release builds, so a build here matches one made at home
      # Qt for the app; Pillow and pystray only for the tests that still cover the Tk version
      - run: python -m pip install PySide6==6.11.2 pillow==12.3.0 pystray==0.19.5 six==1.17.0 pyinstaller==6.22.3 pyinstaller-hooks-contrib==2026.7
      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Get-Command ISCC.exe -ErrorAction SilentlyContinue) -and -not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) {
            choco install innosetup --no-progress -y
          }
      - run: python tools/build_release.py
        env:
          PSFOCUS_OAUTH_CREDENTIALS: ${{ secrets.PSFOCUS_OAUTH_CREDENTIALS }}
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: dist/installer/
          if-no-files-found: error
