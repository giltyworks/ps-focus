<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="icon" href="{{ '/assets/logo.png' | relative_url }}">
  <style>
    :root {
      --background: #000000;
      --panel: #121212;
      --border: #2e2e2e;
      --text: #eef3f1;
      --muted: #8d9a98;
      --accent: #79d6bd;
      --accent-dark: #284e45;
      --blue: #3d5ce6;
      --blue-light: #5875ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--background);
      color: var(--text);
      font: 16px/1.65 "Segoe UI", system-ui, -apple-system, sans-serif;
    }
    header, main, footer { max-width: 720px; margin: 0 auto; padding: 0 16px; }
    header { display: flex; align-items: center; gap: 12px; padding-top: 24px; padding-bottom: 24px; }
    header img { width: 40px; height: 40px; }
    header a.brand { color: var(--text); font-weight: 500; font-size: 18px; text-decoration: none; margin-right: auto; }
    /* PS is set in a rounded typeface, to match the logo's rounded stroke, and a little heavier than Focus.
       The font file holds only P and S and is served from this site, so visitors' browsers contact no one else */
    @font-face { font-family: "PS Rounded"; font-weight: 800; src: url("{{ '/assets/fonts/mplus-rounded-ps.woff2' | relative_url }}") format("woff2"); }
    header a.brand b { font-family: "PS Rounded", "Segoe UI", sans-serif; font-weight: 800; }
    nav a { color: var(--muted); text-decoration: none; margin-left: 16px; font-size: 14px; }
    nav a:hover { color: var(--accent); }
    main { padding-bottom: 48px; }
    h1 { font-size: 32px; line-height: 1.2; margin: 16px 0; }
    h2 { font-size: 20px; margin: 36px 0 8px; }
    p, li { color: var(--text); }
    a { color: var(--accent); }
    code { background: var(--panel); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 14px; overflow-wrap: anywhere; }
    .lead { color: var(--muted); font-size: 18px; }
    /* The download button is the royal blue the app uses for its calendar days and checkboxes */
    .button {
      display: inline-block;
      background: var(--blue);
      color: #ffffff;
      border: 1px solid var(--blue);
      border-radius: 8px;
      padding: 12px 22px;
      font-weight: 600;
      text-decoration: none;
      margin: 8px 0;
    }
    .button:hover { background: var(--blue-light); border-color: var(--blue-light); }
    .shots { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-start; margin: 24px 0 8px; }
    .shots figure { margin: 0; flex: 0 1 342px; }
    .shots img { display: block; max-width: 100%; height: auto; border: 1px solid var(--border); border-radius: 8px; }
    .shots figcaption, .caption { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
    .note { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; color: var(--muted); font-size: 14px; }
    .note p { color: var(--muted); margin: 6px 0; }
    footer { border-top: 1px solid var(--border); padding-top: 20px; padding-bottom: 40px; color: var(--muted); font-size: 14px; }
    footer a { color: var(--muted); }
    footer .disclaimer { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
    /* The homepage is laid out compactly over a wider column: the introduction, the notes and the features
       on the left, the app screenshots beside them, and the short sections as a row of cards. The privacy and
       terms pages keep the narrower column, as long lines of text are harder to read */
    .home header, .home main, .home footer { max-width: 960px; }
    .home { line-height: 1.55; }
    .home header { padding-top: 16px; padding-bottom: 12px; }
    .home h1 { margin: 8px 0 10px; }
    .home h2 { font-size: 18px; margin: 24px 0 4px; }
    .home .lead { margin: 0 0 8px; }
    /* What the app does, said large and plainly straight under the headline, then a quieter line of detail */
    .home .what { font-size: 22px; line-height: 1.35; font-weight: 400; color: #c9d1cf; margin: 0 0 6px; }
    /* The headline is the largest text and the line under it lighter, so the two read in order. It is sized
       to stay on one line in the hero's column, shrinking on narrow screens */
    .home h1 { font-size: clamp(28px, 8vw, 38px); margin-bottom: 14px; }
    .home .what-sub { color: var(--muted); font-size: 16px; margin: 0 0 10px; }
    .home ul { margin: 6px 0; padding-left: 22px; }
    /* In the feature list each point's name stays white and its description is a softer grey */
    .hero-features li { color: #b4bebc; }
    .hero-features li strong { color: var(--text); }
    .home p { margin: 6px 0; }
    .hero { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); grid-template-areas: "intro shots" "note shots" "features shots"; column-gap: 28px; align-items: start; }
    .hero-intro { grid-area: intro; }
    .hero .note { grid-area: note; }
    .hero-features { grid-area: features; }
    .hero-shots { grid-area: shots; }
    .hero .shots { margin: 4px 0 0; flex-wrap: nowrap; }
    .hero .shots figure { flex: 1 1 0; }
    /* Who makes PS Focus: a round picture with a thin ring, the name, one line, and the social sites as logos */
    .maker { display: flex; align-items: center; gap: 20px; margin-top: 28px; }
    .avatar { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid var(--border); flex: none; }
    .maker h2 { margin: 0; font-size: 20px; }
    .maker p { margin: 2px 0 8px; color: var(--muted); }
    .home .socials { list-style: none; display: flex; gap: 10px; padding: 0; margin: 0; }
    .socials a { display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: 50%; background: var(--panel); border: 1px solid var(--border); color: var(--text); }
    .socials a:hover { color: var(--accent); border-color: var(--accent); }
    .socials svg { width: 18px; height: 18px; fill: currentColor; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
    .cards section { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 12px 16px; }
    .cards h2 { margin: 0 0 4px; font-size: 16px; }
    .cards p { font-size: 15px; }
    /* On a narrow screen everything is one column, with the screenshots straight after the download button,
       and on a phone the screenshots stack so they stay large enough to read */
    @media (max-width: 760px) {
      .hero { grid-template-columns: minmax(0, 1fr); grid-template-areas: "intro" "shots" "note" "features"; }
    }
    @media (max-width: 560px) {
      .hero .shots { flex-wrap: wrap; }
      .hero .shots figure { flex: 1 1 100%; }
    }
  </style>
</head>
<body{% if page.body_class %} class="{{ page.body_class }}"{% endif %}>
  <header>
    <img src="{{ '/assets/logo.png' | relative_url }}" alt="">
    <a class="brand" href="{{ '/' | relative_url }}"><b>PS</b> Focus</a>
    <nav>
      <a href="{{ '/privacy/' | relative_url }}">Privacy</a>
      <a href="{{ '/terms/' | relative_url }}">Terms</a>
    </nav>
  </header>
  <main>
    {{ content }}
  </main>
  <footer>
    Made by Giltyworks · <a href="mailto:giltyworks@gmail.com">giltyworks@gmail.com</a> ·
    <a href="{{ '/privacy/' | relative_url }}">Privacy Policy</a> ·
    <a href="{{ '/terms/' | relative_url }}">Terms of Use</a>
    <p class="disclaimer">PS Focus is not affiliated with Adobe, the Krita Foundation, or Celsys. Photoshop, Krita, and Clip Studio Paint are trademarks of their respective owners.</p>
  </footer>
</body>
</html>
