<style>
/* Layout: the app's near-black bench, one 9:16 story card beside a short control panel; stacks on a phone */
:root {
  --bg: #080808;
  --panel: #111312;
  --line: #232725;
  --text: #eef3f1;
  --muted: #8d9a98;
  --accent: #79d6bd;
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
body { background: var(--bg); color: var(--text); font-family: var(--display); }
.page { max-width: 1240px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; grid-template-columns: minmax(0, 380px) minmax(0, 380px) minmax(0, 1fr); gap: 28px; align-items: start; }
@media (max-width: 1100px) { .page { grid-template-columns: repeat(2, minmax(0, 1fr)); } .side { grid-column: 1 / -1; } }
@media (max-width: 720px) { .page { grid-template-columns: minmax(0, 1fr); } .phone { max-width: 380px; margin: 0 auto; width: 100%; } .card { max-width: 420px; margin: 0 auto; width: 100%; } }
.side { display: grid; gap: 16px; min-width: 0; }
.side h1 { font-size: 26px; font-weight: 800; font-stretch: 88%; margin: 0; letter-spacing: -0.01em; }
.side p { color: var(--muted); margin: 0; line-height: 1.5; font-size: 14px; }
.controls { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }
.controls label { display: grid; gap: 4px; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); min-width: 0; }
.controls input { font: 14px var(--display); color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; min-width: 0; }
.controls input:focus-visible, .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.wide { grid-column: 1 / -1; }
.btn { font: 600 13px var(--display); color: var(--text); background: transparent; border: 1px solid var(--line); border-radius: 7px; padding: 8px 12px; cursor: pointer; justify-self: start; }

/* The card: sized in container units so it scales like a real 1080x1920 story */
.card { container-type: inline-size; position: relative; aspect-ratio: 9 / 16; width: 100%; max-width: 100%; border-radius: 14px; overflow: hidden; background: #777 center / cover no-repeat; color: #e6e8eb; box-shadow: 0 20px 50px -20px rgba(0,0,0,.8); }
.scrim { position: absolute; inset: 0; pointer-events: none; background: linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.08) 24%, rgba(0,0,0,0) 40%, rgba(0,0,0,.3) 54%, rgba(0,0,0,.36) 100%), rgba(0,0,0,var(--dim,.1)); }
.in { position: absolute; inset: 0; padding: 7cqw; display: flex; flex-direction: column; }
.top { display: flex; justify-content: space-between; align-items: flex-start; gap: 3cqw; }
.head { display: grid; gap: 1cqw; min-width: 0; }
.date { font-size: calc(var(--size-date, 3.05) * 1cqw); font-weight: 450; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 2.2cqw; justify-self: start; padding: .4em .85em; border-radius: 99px; background: rgba(255,255,255,.24); backdrop-filter: blur(3cqw) saturate(1.5) brightness(1.1); -webkit-backdrop-filter: blur(3cqw) saturate(1.5) brightness(1.1); }
.title { font-size: calc(var(--size-title, 6.6) * 1cqw); font-weight: 750; letter-spacing: -0.01em; line-height: 1.1; }
.sub { font-size: calc(var(--size-sub, 4.1) * 1cqw); font-weight: 500; opacity: .85; }
.logo { width: 8cqw; height: 8cqw; border-radius: 50%; flex: none; opacity: .55; }
.stats { margin-top: auto; display: grid; gap: 4.4cqw; }
.stat { display: grid; gap: .6cqw; }
.label { font-size: calc(var(--size-label, 3.9) * 1cqw); font-weight: 600; opacity: .92; }
.big { color: #fff; font-size: calc(var(--size-big, 15) * 1cqw); font-weight: 660; font-stretch: 96%; letter-spacing: -0.025em; line-height: .95; font-variant-numeric: tabular-nums; }
.records { display: grid; gap: .6cqw; order: -1; }
.records .label { display: flex; align-items: center; gap: 1.6cqw; }
.record { display: flex; align-items: center; gap: 2.4cqw; font-size: calc(var(--size-record, 4.6) * 1cqw); font-weight: 650; line-height: 1.15; }
.medal { flex: none; width: 1.13em; height: 1.13em; border-radius: 50%; }
.medal.gold { background: radial-gradient(circle at 35% 30%, #fff4c8, #f0c33c 55%, #9c7514); }
.medal.silver { background: radial-gradient(circle at 35% 30%, #ffffff, #c3cbd1 55%, #737d84); }
.medal.bronze { background: radial-gradient(circle at 35% 30%, #ffe0c2, #d0874a 55%, #7d4a20); }
.check { display: flex !important; grid-template-columns: none; align-items: center; gap: 8px; text-transform: none !important; letter-spacing: 0 !important; font-size: 13px !important; color: var(--text) !important; }
.check input { width: 16px; height: 16px; accent-color: var(--accent); }
.group-title { grid-column: 1 / -1; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin-top: 4px; }
.size output { float: right; color: var(--text); font-variant-numeric: tabular-nums; letter-spacing: 0; }
.records .count { display: flex; align-items: center; gap: .18em; }
.rosette { width: .66em; height: .66em; flex: none; }
.record-names { white-space: pre-line; display: block; line-height: 1.3; gap: .8cqw; margin-top: 1.4cqw; font-size: calc(var(--size-record, 4.6) * 1cqw); font-weight: 600; opacity: .9; }
[contenteditable] { outline: none; cursor: text; }
[contenteditable]:hover { box-shadow: 0 0 0 .5cqw rgba(255,255,255,.25); }
[contenteditable]:focus { box-shadow: 0 0 0 .5cqw rgba(121,214,189,.9); }
[contenteditable][data-edited] { text-decoration: underline dotted rgba(121,214,189,.0); }
.record-names:empty { display: none; }
/* The phone preview: the card as it sits in a story, over a blurred, enlarged copy of its own photo */
.preview { display: grid; gap: 10px; min-width: 0; }
.preview-label { font-size: 11px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.phone { position: relative; aspect-ratio: 9 / 19.5; width: 100%; max-width: 100%; border-radius: 34px; overflow: hidden; background: #000; border: 6px solid #1b1d1c; container-type: inline-size; }
.phone .blur { position: absolute; inset: -8%; background: #555 center / cover no-repeat; filter: blur(5cqw) brightness(.72) saturate(1.1); transform: scale(1.1); }
.phone .slot { position: absolute; left: 9%; right: 9%; top: 15.5%; }
.phone .slot .card { border-radius: 4.5cqw; box-shadow: 0 0 0 1px rgba(255,255,255,.1), 0 4cqw 10cqw -3cqw rgba(0,0,0,.6); }
.phone .slot [contenteditable] { pointer-events: none; }
.chrome { position: absolute; inset: 0; pointer-events: none; color: #fff; font-family: -apple-system, "Segoe UI", system-ui, sans-serif; }
.bars { position: absolute; top: 7.5%; left: 2%; right: 2%; display: flex; gap: 1cqw; }
.bars i { flex: 1; height: .6cqw; border-radius: 1cqw; background: rgba(255,255,255,.35); }
.bars i:first-child { background: linear-gradient(90deg, #fff 30%, rgba(255,255,255,.35) 30%); }
.who { position: absolute; top: 9.6%; left: 4%; right: 4%; display: flex; align-items: center; gap: 3cqw; font-size: 4.2cqw; font-weight: 600; }
.who .avatar { width: 9cqw; height: 9cqw; border-radius: 50%; background: linear-gradient(135deg, #8a8f8d, #3c403f); flex: none; }
.who .ago { opacity: .7; font-weight: 400; }
.who .x { margin-left: auto; font-size: 7cqw; font-weight: 300; line-height: 1; }
.status { position: absolute; top: 2.2%; left: 7%; right: 7%; display: flex; justify-content: space-between; font-size: 4cqw; font-weight: 600; }
.reply { position: absolute; bottom: 4.5%; left: 4%; right: 4%; display: flex; align-items: center; gap: 3cqw; }
.reply .box { flex: 1; border: 1px solid rgba(255,255,255,.55); border-radius: 99px; padding: 2.6cqw 4cqw; font-size: 3.8cqw; opacity: .85; }
.reply svg { width: 7cqw; height: 7cqw; flex: none; }
</style>

  <div class="side">
    <h1>Session story</h1>
    <p>One session on its own: no streak or level, so a short session is still worth posting. Tap any text on the card to change it.</p>
    <button class="btn" type="button" id="f-reset" hidden>Undo my text edits</button>
    <form class="controls" id="controls" autocomplete="off">
      <label>Photoshop minutes<input id="f-ps" type="number" min="0" value="112"></label>
      <label>Krita minutes<input id="f-krita" type="number" min="0" value="0"></label>
      <label>Started<input id="f-start" type="time" value="13:14"></label>
      <label>Day<input id="f-day" type="date" value="2026-10-31"></label>
      <div class="group-title">Text sizes (px on a 1080-wide story)</div>
      <label class="size">Date <output id="o-size-date"></output><input id="f-size-date" data-size="date" type="range" min="2" max="7" step="0.05" value="3.05"></label>
      <label class="size">Session title <output id="o-size-title"></output><input id="f-size-title" data-size="title" type="range" min="4" max="10" step="0.1" value="6.6"></label>
      <label class="size">Program <output id="o-size-sub"></output><input id="f-size-sub" data-size="sub" type="range" min="2.5" max="7" step="0.1" value="4.1"></label>
      <label class="size">Stat labels <output id="o-size-label"></output><input id="f-size-label" data-size="label" type="range" min="2.5" max="7" step="0.1" value="3.9"></label>
      <label class="size">Big numbers <output id="o-size-big"></output><input id="f-size-big" data-size="big" type="range" min="9" max="22" step="0.1" value="15"></label>
      <label class="size">Records <output id="o-size-record"></output><input id="f-size-record" data-size="record" type="range" min="3" max="7" step="0.1" value="4.6"></label>
      <div class="group-title">Records this session set</div>
      <label class="check wide"><input type="checkbox" id="f-names">Also list what the records are</label>
      <label class="check wide"><input type="checkbox" id="r-ever" data-medal="gold" data-text="Longest session ever">Longest session ever</label>
      <label class="check wide"><input type="checkbox" id="r-program" data-medal="gold" data-text="Longest {program} session" checked>Longest session in this program</label>
      <label class="check wide"><input type="checkbox" id="r-year" data-medal="silver" data-text="Longest session this year">Longest session this year</label>
      <label class="check wide"><input type="checkbox" id="r-month" data-medal="bronze" data-text="Longest session this month" checked>Longest session this month</label>
      <label class="wide">Darken photo<input id="f-dim" type="range" min="0" max="60" value="10"></label>
      <label class="btn wide" for="f-photo" style="text-transform:none;letter-spacing:0;font-size:13px;color:var(--text)">Try another photo</label>
      <input id="f-photo" type="file" accept="image/*" hidden>
    </form>
  </div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const background = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='9' height='16'><defs><linearGradient id='g' x2='0' y2='1'><stop offset='0' stop-color='%23555'/><stop offset='1' stop-color='%23999'/></linearGradient></defs><rect width='9' height='16' fill='url(%23g)'/></svg>";
  let photoUrl = null;
  const duration = m => m >= 60 ? `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, "0")}m` : `${m}m`;
  const clock = minutes => {
    const h = Math.floor(minutes / 60) % 24, m = minutes % 60;
    return `${(h % 12) || 12}:${String(m).padStart(2, "0")}${h < 12 ? "am" : "pm"}`;
  };
  const partOfDay = h => h < 5 ? "Late Night" : h < 12 ? "Morning" : h < 14 ? "Lunch" : h < 17 ? "Afternoon" : h < 21 ? "Evening" : "Late Night";

  // Text the user typed on the card wins over the automatic text until they undo their edits
  const put = (id, text) => { const el = $(id); if (!el.hasAttribute("data-edited")) el.textContent = text; };
  const card = $("card");
  card.addEventListener("input", e => {
    const el = e.target.closest("[contenteditable]");
    if (el) { el.setAttribute("data-edited", ""); $("f-reset").hidden = false; mirror(); }
  });
  card.addEventListener("keydown", e => {
    // Enter finishes a one-line field; the record names may take several lines
    if (e.key === "Enter" && e.target.id !== "o-rec-names") { e.preventDefault(); e.target.blur(); }
  });
  const labels = [...card.querySelectorAll(".label[contenteditable]")].map(el => [el, el.textContent]);
  $("f-reset").addEventListener("click", () => {
    card.querySelectorAll("[data-edited]").forEach(el => el.removeAttribute("data-edited"));
    labels.forEach(([el, text]) => { el.textContent = text; });
    $("f-reset").hidden = true;
    render();
  });

  function render() {
    const ps = Math.max(0, +$("f-ps").value || 0), krita = Math.max(0, +$("f-krita").value || 0);
    const total = ps + krita;
    const [sh, sm] = ($("f-start").value || "13:14").split(":").map(Number);
    const start = sh * 60 + sm;
    const day = new Date(($("f-day").value || "2026-10-31") + "T12:00");
    const programs = [["Photoshop", ps], ["Krita", krita]].filter(p => p[1] > 0).sort((a, b) => b[1] - a[1]);
    put("o-title", `${day.toLocaleDateString("en-AU", { weekday: "short" })} ${partOfDay(sh)} Session`);
    put("o-date", day.toLocaleDateString("en-AU", { day: "numeric", month: "long", year: "numeric" }));
    put("o-apps", programs.map(p => p[0]).join(" · ") || "No programs");
    put("o-total", duration(total));
    put("o-start", clock(start));
    // Only the biggest records show: "ever" outranks the year, which outranks the month, so the card never lists both
    const earned = [...document.querySelectorAll("[data-medal]")].filter(box => box.checked);
    const shown = [];
    for (const box of earned) {
      if (box.id === "r-year" && $("r-ever").checked) continue;
      if (box.id === "r-month" && ($("r-ever").checked || $("r-year").checked)) continue;
      shown.push(box);
    }
    const records = $("o-records");
    records.hidden = shown.length === 0;
    // Hevy's look: a count beside a gold rosette, with the names underneath only if asked for
    // The app's own award icon (qt/icons.py): a flat disc over two swallowtail tails, with a gap cut between them
    const rosette = `<svg class="rosette" viewBox="0 0 100 100" aria-hidden="true">
      <defs><mask id="award-gap"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="34" r="39.5" fill="#000"/></mask></defs>
      <g fill="#f0c33c" mask="url(#award-gap)">
        <polygon points="47,50 25,50 13,96 24,89 35,100"/><polygon points="53,50 75,50 87,96 76,89 65,100"/>
      </g>
      <circle cx="50" cy="34" r="32" fill="#f0c33c"/></svg>`;
    const program = programs[0] ? programs[0][0] : "";
    $("o-rosette").innerHTML = rosette;
    put("o-rec-count", String(shown.length));
    put("o-rec-names", $("f-names").checked ? shown.map(box => box.dataset.text.replace("{program}", program)).join("\n") : "");
    document.querySelectorAll("[data-size]").forEach(slider => {
      card.style.setProperty(`--size-${slider.dataset.size}`, slider.value);
      $(`o-size-${slider.dataset.size}`).textContent = `${Math.round(slider.value * 10.8)}px`;
    });
    card.style.setProperty("--dim", ($("f-dim").value / 100).toFixed(2));
    card.style.backgroundImage = `url("${photoUrl || background}")`;
    mirror();
  }

  // Copy the card into the phone after every change, so the story preview always matches the editable card
  function mirror() {
    const copy = card.cloneNode(true);
    copy.removeAttribute("id");
    copy.querySelectorAll("[id]").forEach(el => el.removeAttribute("id"));
    copy.querySelectorAll("[contenteditable]").forEach(el => el.removeAttribute("contenteditable"));
    $("phone-slot").replaceChildren(copy);
    $("phone-blur").style.backgroundImage = card.style.backgroundImage;
  }
  $("controls").addEventListener("input", render);
  $("controls").addEventListener("submit", e => e.preventDefault());
  $("f-photo").addEventListener("change", e => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    if (photoUrl) URL.revokeObjectURL(photoUrl);
    photoUrl = URL.createObjectURL(file);
    render();
  });
  render();
})();
</script>
